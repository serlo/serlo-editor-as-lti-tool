services:
  mongo:
    image: mongo:6 # Match major version on Uberspace
    ports:
      - 27017:27017
  mariadb:
    image: mariadb:10 # Match major version on Uberspace
    environment:
      # Create database 'serlo'
      - MARIADB_DATABASE=serlo

      - MARIADB_PASSWORD=secret
      - MARIADB_ROOT_PASSWORD=secret
    ports:
      - 3306:3306
