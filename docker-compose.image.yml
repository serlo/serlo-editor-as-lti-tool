services:
  app:
    build: .
    develop:
      watch:
          - action: rebuild
            path: ./src
    ports:
      - 3000:3000
    networks:
      - serlo-network
    env_file:
      - .env.image
  mocks:
    image: node:22
    ports:
      - 8100:8100
      - 8101:8101
    networks:
      - serlo-network
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: ['yarn', 'dev-mocks']
    env_file:
      - .env.image
networks:
  serlo-network:
